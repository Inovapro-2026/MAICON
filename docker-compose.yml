# SAVYRON — desenvolvimento local
# Serviços: Redis (filas). Em produção, o banco é Neon (excluído aqui).

services:
  redis:
    image: redis:7-alpine
    container_name: prospector-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # (Opcional) Postgres local para desenvolvimento sem Neon:
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: prospector-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: prospector
  #     POSTGRES_PASSWORD: prospector
  #     POSTGRES_DB: prospector
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  redis-data:
  pg-data:
